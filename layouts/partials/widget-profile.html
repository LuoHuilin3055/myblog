<!-- 个人资料卡片 -->
<div style="
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  border: var(--card-border);
  box-shadow: var(--shadow-card);
">
  <!-- 标题 -->
  <div style="
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  ">
    <svg style="width: 20px; height: 20px; color: var(--accent-color);" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
    <h4 style="
      color: var(--text-primary);
      font-size: 1.1em;
      margin: 0;
      font-weight: 500;
      font-family: KaiTi, STKaiti, serif;
    ">个人资料</h4>
  </div>
  
  <!-- 内容区域 -->
  <div style="text-align: center;">
  <!-- 头像 -->
  <div style="
    width: 100px;
    height: 100px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 15px;
    border: 3px solid var(--accent-color);
  ">
    <img src="{{ .Site.Params.avatar | relURL }}" alt="Avatar" style="
      width: 100%;
      height: 100%;
      object-fit: cover;
    ">
  </div>
  
  <!-- 昵称 -->
  <h3 style="
    color: var(--text-primary);
    font-size: 1.5em;
    margin: 0 0 8px;
    font-weight: 500;
  ">{{ .Site.Params.author | default "博主" }}</h3>
  
  <!-- 个性签名 -->
  <p style="
    color: var(--text-secondary);
    font-size: 0.9em;
    margin: 0 0 20px;
  ">{{ .Site.Params.bio | default "Hi, there ~ 👋" }}</p>
  
  <!-- 统计信息 -->
  <div style="
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 20px;
  ">
    <div style="text-align: center;">
      <div style="color: var(--text-primary); font-size: 1.2em; font-weight: bold;">{{ len (where .Site.RegularPages "Type" "posts") }}</div>
      <div style="color: var(--text-muted); font-size: 0.8em;">文章</div>
    </div>
    <div style="text-align: center;">
      <div style="color: var(--text-primary); font-size: 1.2em; font-weight: bold;">{{ len .Site.Taxonomies.tags }}</div>
      <div style="color: var(--text-muted); font-size: 0.8em;">标签</div>
    </div>
  </div>
  
  <!-- Follow Me 按钮 -->
  {{ if .Site.Params.github }}
  <a class="blog-widget-follow-link" href="{{ .Site.Params.github }}" target="_blank" rel="noopener noreferrer">
    <span style="display: inline-flex; align-items: center; gap: 8px;">
      <svg style="width: 18px; height: 18px;" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
      </svg>
      Follow Me
    </span>
  </a>
  {{ end }}
  </div>
</div>
