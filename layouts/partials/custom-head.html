<!-- 全局字体样式 -->
<style>
  /* 主题切换按钮样式 */
  .theme-toggle {

    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;

    color: white;

    opacity: 0.8;

    --bg-secondary: #e2e8f0;
    --bg-card: #ffffff;
    --bg-hover: #f8fafc;
    --text-primary: #1e293b;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
    --border-light: #e2e8f0;
    --accent-color: #3b82f6;
    --accent-hover: #2563eb;
    --accent-light: #dbeafe;
    --accent-glow: rgba(59, 130, 246, 0.2);
    --shadow: rgba(0, 0, 0, 0.08);
    --shadow-hover: rgba(59, 130, 246, 0.2);
    --shadow-card: rgba(0, 0, 0, 0.12);
    --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-accent: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    --card-border: 1px solid #cbd5e1;
  }

  /* 黑夜模式样式 (默认) */
  [data-theme="dark"] {
    --bg-primary: #111111;
    --bg-secondary: #111111;
    --bg-card: #1a1d29;
    --bg-hover: #252836;
    --text-primary: #ffffff;
    --text-secondary: #cccccc;
    --text-muted: #888888;
    --border-color: #2a2d3a;
    --border-light: #1e2130;
    --accent-color: #00ffff;
    --accent-hover: #00cccc;
    --accent-light: rgba(0, 255, 255, 0.1);
    --accent-glow: rgba(0, 255, 255, 0.2);
    --shadow: rgba(0, 0, 0, 0.3);
    --shadow-hover: rgba(0, 255, 255, 0.2);
    --shadow-card: rgba(0, 0, 0, 0.4);
    --gradient-primary: linear-gradient(135deg, #00ffff 0%, #a5b4fc 100%);
    --gradient-accent: linear-gradient(135deg, #00ffff 0%, #0080ff 100%);
    --card-border: 1px solid #2a2d3a;
  }

  body {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    line-height: 2;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  * {
    font-family: inherit;
    line-height: inherit;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    line-height: 1.8;
    color: var(--text-primary);
  }

  code,
  pre,
  kbd,
  samp {
    font-family: var(--font-mono, "Comic Sans MC", "Comic Sans MS", "楷体", "KaiTi", "STKaiti", cursive, serif) !important;
  }

  .article-content .katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0.35rem 0;
  }

  a, button {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    color: var(--text-primary);
  }

  input, textarea, select {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    color: var(--text-primary);
  }

  /* 图片滑动容器 */
  .image-slider-container {
    width: 100%;
    overflow: hidden;
    margin: 20px 0;
    position: relative;
  }

  .image-slider {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    gap: 15px;
    padding: 10px 0;
    white-space: nowrap;
  }

  .image-slider::-webkit-scrollbar {
    display: none;
  }

  .image-slider {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .image-slider img {
    flex-shrink: 0;
    width: 280px;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 6px 20px var(--shadow);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }

  .image-slider img:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 30px var(--shadow-hover);
  }

  .slider-hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85em;
    margin-top: 5px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 单张图片样式 */
  .single-image-container {
    text-align: center;
    margin: 20px 0;
  }

  .single-image-container img {
    max-width: 100%;
    height: auto;
    max-height: 500px;
    border-radius: 12px;
    box-shadow: 0 6px 20px var(--shadow);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .single-image-container img:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 30px var(--shadow-hover);
  }
</style>

{{ if ne .Site.Params.enable_busuanzi false }}
<!-- 不蒜子网站统计：同一浏览器访问同一页面时，冷却期内不重复上报。 -->
<script>
  (() => {
    const cooldownMinutes = {{ .Site.Params.busuanzi_cooldown_minutes | default 30 }};
    const cooldownMs = Math.max(0, Number(cooldownMinutes)) * 60 * 1000;
    const visitKey = `clairis:busuanzi:last-counted:${location.origin}${location.pathname}`;
    const cacheKey = 'clairis:busuanzi:site-totals';
    const counterIds = ['busuanzi_value_site_uv', 'busuanzi_value_site_pv'];

    const readStorage = (key) => {
      try {
        return localStorage.getItem(key);
      } catch (_) {
        return null;
      }
    };

    const writeStorage = (key, value) => {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (_) {
        return false;
      }
    };

    const removeStorage = (key) => {
      try {
        localStorage.removeItem(key);
      } catch (_) {}
    };

    const restoreCachedTotals = () => {
      let cached;
      try {
        cached = JSON.parse(readStorage(cacheKey) || 'null');
      } catch (_) {
        cached = null;
      }

      const values = cached && cached.values ? cached.values : {};
      counterIds.forEach((id) => {
        const element = document.getElementById(id);
        if (!element) return;
        element.textContent = values[id] || '暂未更新';
      });
    };

    const cacheTotalsWhenReady = () => {
      const saveIfReady = () => {
        const values = {};
        const ready = counterIds.every((id) => {
          const element = document.getElementById(id);
          const value = element ? element.textContent.trim() : '';
          if (!value || value === '统计中...' || value === '暂未更新') return false;
          values[id] = value;
          return true;
        });

        if (ready) {
          writeStorage(cacheKey, JSON.stringify({ values, updatedAt: Date.now() }));
        }
        return ready;
      };

      if (saveIfReady()) return;

      const observer = new MutationObserver(() => {
        if (saveIfReady()) observer.disconnect();
      });
      counterIds.forEach((id) => {
        const element = document.getElementById(id);
        if (element) observer.observe(element, { childList: true, characterData: true, subtree: true });
      });
      window.setTimeout(() => observer.disconnect(), 10000);
    };

    const start = () => {
      const lastCountedAt = Number(readStorage(visitKey) || 0);
      const shouldCount = !lastCountedAt || Date.now() - lastCountedAt >= cooldownMs;

      if (!shouldCount) {
        restoreCachedTotals();
        return;
      }

      // 先记录时间，避免连续刷新或多个标签页在脚本返回前重复上报。
      writeStorage(visitKey, String(Date.now()));
      cacheTotalsWhenReady();

      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
      script.onerror = () => {
        removeStorage(visitKey);
        restoreCachedTotals();
      };
      document.head.appendChild(script);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start, { once: true });
    } else {
      start();
    }
  })();
</script>
{{ end }}
