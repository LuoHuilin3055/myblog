<!-- 全局字体样式 -->
<style>
  /* 主题切换按钮样式 */
  .theme-toggle {
    background: transparent;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;
    transition: all 0.3s ease;
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .theme-toggle:hover {
    transform: rotate(20deg) scale(1.1);
    opacity: 0.8;
  }

  /* 白天模式样式 - 清新现代风格 */
  :root {
    --bg-primary: #f1f5f9;
    --bg-secondary: #e2e8f0;
    --bg-card: #ffffff;
    --bg-hover: #f8fafc;
    --text-primary: #1e293b;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
    --border-light: #e2e8f0;
    --accent-color: #3b82f6;
    --accent-hover: #2563eb;
    --accent-light: #dbeafe;
    --accent-glow: rgba(59, 130, 246, 0.2);
    --shadow: rgba(0, 0, 0, 0.08);
    --shadow-hover: rgba(59, 130, 246, 0.2);
    --shadow-card: rgba(0, 0, 0, 0.12);
    --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-accent: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    --card-border: 1px solid #cbd5e1;
  }

  /* 黑夜模式样式 (默认) */
  [data-theme="dark"] {
    --bg-primary: #111111;
    --bg-secondary: #111111;
    --bg-card: #1a1d29;
    --bg-hover: #252836;
    --text-primary: #ffffff;
    --text-secondary: #cccccc;
    --text-muted: #888888;
    --border-color: #2a2d3a;
    --border-light: #1e2130;
    --accent-color: #00ffff;
    --accent-hover: #00cccc;
    --accent-light: rgba(0, 255, 255, 0.1);
    --accent-glow: rgba(0, 255, 255, 0.2);
    --shadow: rgba(0, 0, 0, 0.3);
    --shadow-hover: rgba(0, 255, 255, 0.2);
    --shadow-card: rgba(0, 0, 0, 0.4);
    --gradient-primary: linear-gradient(135deg, #00ffff 0%, #a5b4fc 100%);
    --gradient-accent: linear-gradient(135deg, #00ffff 0%, #0080ff 100%);
    --card-border: 1px solid #2a2d3a;
  }

  body {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    line-height: 2;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  * {
    font-family: inherit;
    line-height: inherit;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    line-height: 1.8;
    color: var(--text-primary);
  }

  code,
  pre,
  kbd,
  samp {
    font-family: var(--font-mono, "Comic Sans MC", "Comic Sans MS", "楷体", "KaiTi", "STKaiti", cursive, serif) !important;
  }

  a, button {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    color: var(--text-primary);
  }

  input, textarea, select {
    font-family: "Comic Sans MS", "楷体", "KaiTi", "STKaiti", serif;
    color: var(--text-primary);
  }

  /* 图片滑动容器 */
  .image-slider-container {
    width: 100%;
    overflow: hidden;
    margin: 20px 0;
    position: relative;
  }

  .image-slider {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    gap: 15px;
    padding: 10px 0;
    white-space: nowrap;
  }

  .image-slider::-webkit-scrollbar {
    display: none;
  }

  .image-slider {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .image-slider img {
    flex-shrink: 0;
    width: 280px;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 6px 20px var(--shadow);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }

  .image-slider img:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 30px var(--shadow-hover);
  }

  .slider-hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85em;
    margin-top: 5px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 单张图片样式 */
  .single-image-container {
    text-align: center;
    margin: 20px 0;
  }

  .single-image-container img {
    max-width: 100%;
    height: auto;
    max-height: 500px;
    border-radius: 12px;
    box-shadow: 0 6px 20px var(--shadow);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .single-image-container img:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 30px var(--shadow-hover);
  }
</style>
