<div class="blog-article-footer">
  <div class="blog-article-footer-row">
    {{ if .Params.tags }}
    <div class="blog-article-footer-tags">
      <span class="blog-article-footer-label">标签：</span>
      {{ range .Params.tags }}
        <a class="blog-article-footer-tag" href="{{ printf "tags/%s" (. | urlize) | relURL }}">{{ . }}</a>
      {{ end }}
    </div>
    {{ end }}

    <div class="blog-article-share">
      <span class="blog-article-footer-label">分享：</span>
      <a class="blog-share-link blog-share-twitter" href="https://twitter.com/intent/tweet?text={{ .Title }}&url={{ .Permalink }}" target="_blank" rel="noopener noreferrer">Twitter</a>
      <a class="blog-share-link blog-share-facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" rel="noopener noreferrer">Facebook</a>
    </div>
  </div>

  {{ if or .PrevInSection .NextInSection }}
  <nav class="blog-post-nav" aria-label="文章导航">
    {{ with .PrevInSection }}
    <a class="blog-post-nav-card" href="{{ .RelPermalink }}">
      <span class="blog-post-nav-kicker">← 上一篇</span>
      <strong>{{ .Title }}</strong>
    </a>
    {{ else }}
    <span class="blog-post-nav-spacer"></span>
    {{ end }}

    {{ with .NextInSection }}
    <a class="blog-post-nav-card blog-post-nav-card-next" href="{{ .RelPermalink }}">
      <span class="blog-post-nav-kicker">下一篇 →</span>
      <strong>{{ .Title }}</strong>
    </a>
    {{ else }}
    <span class="blog-post-nav-spacer"></span>
    {{ end }}
  </nav>
  {{ end }}
</div>
