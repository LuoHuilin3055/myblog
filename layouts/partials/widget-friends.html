<!-- 友链组件 -->
<div style="
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  border: var(--card-border);
  box-shadow: var(--shadow-card);
">
  <!-- 标题 -->
  <div style="
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  ">
    <svg style="width: 20px; height: 20px; color: var(--accent-color);" fill="currentColor" viewBox="0 0 24 24">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71">
      </path>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71">
      </path>
    </svg>
    <h4 style="
      color: var(--text-primary);
      font-size: 1.1em;
      margin: 0;
      font-weight: 500;
      font-family: KaiTi, STKaiti, serif;
    ">友情链接</h4>
  </div>
  
  <!-- 友链列表 -->
  <div style="display: flex; flex-direction: column; gap: 12px;">
    {{ if .Site.Data.friends }}
      {{ range .Site.Data.friends }}
        <a class="blog-widget-friend-link" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
          <!-- 头像 -->
          <div style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            flex-shrink: 0;
          ">
            <img src="{{ .avatar }}" alt="{{ .name }}" style="
              width: 100%;
              height: 100%;
              object-fit: cover;
            ">
          </div>
          
          <!-- 信息 -->
          <div style="flex: 1; min-width: 0;">
            <div style="color: var(--text-primary); font-size: 0.95em; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              {{ .name }}
            </div>
            <div style="color: var(--text-muted); font-size: 0.75em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              {{ .description }}
            </div>
          </div>
        </a>
      {{ end }}
    {{ else }}
      <div style="color: var(--text-muted); text-align: center; padding: 20px;">暂无友链</div>
    {{ end }}
  </div>
</div>
