{{ if .TableOfContents }}
<nav id="toc-container" class="blog-toc-panel" aria-label="文章目录">
  <div class="blog-toc-header">
    <div class="blog-toc-heading">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16" />
        <path d="M4 12h16" />
        <path d="M4 18h10" />
      </svg>
      <h3>目录</h3>
    </div>

    <div class="blog-toc-actions">
      <div class="toc-backtop-slot">
        {{ partial "backtop.html" . }}
      </div>
      <button
        type="button"
        class="toc-collapse-button"
        data-toc-toggle
        aria-expanded="true"
        aria-controls="toc-content"
        title="折叠目录"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
        <span id="toc-toggle-text">收起</span>
      </button>
    </div>
  </div>

  <div class="enhanced-toc" id="toc-content" data-collapsed="false">
    <ul class="blog-toc-root">
      <li class="blog-toc-title-item">
        <a href="#page-top">{{ .Title }}</a>
      </li>
    </ul>
    {{ .TableOfContents }}
  </div>
</nav>
{{ end }}
