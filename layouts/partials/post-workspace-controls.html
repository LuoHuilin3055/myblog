<div class="post-workspace-controls" aria-label="文章侧栏控制">
  <button
    class="post-workspace-toggle post-workspace-toggle-left"
    type="button"
    data-post-sidebar-toggle="left"
    aria-controls="post-left-sidebar"
    aria-expanded="false"
    title="打开文章侧栏"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" />
      <path d="M9 3v18" />
    </svg>
    <span>侧栏</span>
  </button>

  <button
    class="post-workspace-toggle post-workspace-toggle-right"
    type="button"
    data-post-sidebar-toggle="right"
    aria-controls="post-toc-sidebar"
    aria-expanded="false"
    title="打开文章目录"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16" />
      <path d="M4 12h16" />
      <path d="M4 18h10" />
    </svg>
    <span>目录</span>
  </button>
</div>

<button class="post-workspace-backdrop" type="button" data-post-workspace-backdrop aria-label="关闭文章侧栏"></button>
