<!-- 精选文章 -->
{{ $featured := where .Site.RegularPages "Params.featured" true }}
{{ if $featured }}
<div style="
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  border: var(--card-border);
  box-shadow: var(--shadow-card);
">
  <!-- 标题 -->
  <div style="
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  ">
    <svg style="width: 20px; height: 20px; color: #f39c12;" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
    </svg>
    <h4 style="
      color: var(--text-primary);
      font-size: 1.1em;
      margin: 0;
      font-weight: 500;
      font-family: KaiTi, STKaiti, serif;
    ">精选文章</h4>
  </div>
  
  <!-- 精选文章列表 -->
  <div style="display: flex; flex-direction: column; gap: 12px;">
    {{ range first 5 $featured }}
    <a href="{{ .Permalink }}" style="
      display: block;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s;
      border: 1px solid rgba(0,255,255,0.1);
    " onmouseover="this.style.background='rgba(0,255,255,0.1)'; this.style.borderColor='rgba(0,255,255,0.3)';" onmouseout="this.style.background='rgba(0,0,0,0.3)'; this.style.borderColor='rgba(0,255,255,0.1)';">
      <div style="
        color: #fff;
        font-size: 0.95em;
        margin-bottom: 5px;
        line-height: 1.4;
      ">{{ .Title }}</div>
      <div style="
        color: #888;
        font-size: 0.8em;
      ">{{ .Date.Format "2006-01-02" }}</div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
