{{ define "header" }}
  <header style="background: transparent; padding: 20px 0; position: absolute; top: 0; left: 0; right: 0; z-index: 100;">
    <nav style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
      <a href="{{ "" | relURL }}" style="color: #00ffff; font-size: 1.5em; text-decoration: none; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">
        {{ .Site.Title }}
      </a>
    </nav>
  </header>
{{ end }}

{{ define "main" }}
  <main style="background-color: var(--bg-primary);">
    <div class="blog-random-shell" style="background-image: url('{{ "images/background.jpg" | relURL }}');">
      <div class="blog-random-overlay"></div>

      <div class="blog-random-container">
        <article class="blog-random-card">
          <h1 class="blog-random-title">{{ .Title }}</h1>
          <div class="article-content blog-random-content">
            {{ .Content }}
          </div>
        </article>
      </div>
    </div>
  </main>

  {{ $posts := where .Site.RegularPages "Type" "posts" }}
  <script>
    const posts = [
      {{ range $posts }}
      "{{ .RelPermalink }}",
      {{ end }}
    ];

    if (posts.length > 0) {
      window.location.href = posts[Math.floor(Math.random() * posts.length)];
    }
  </script>
{{ end }}

{{ define "footer" }}
  <footer style="background-color: #000; padding: 20px; position: relative; bottom: 0; width: 100%;" role="contentinfo">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
      <a href="{{ "" | relURL }}" style="color: #fff; font-size: 1rem; text-decoration: none; padding: 10px 15px; transition: all 0.3s ease;" onmouseover="this.style.color='#00ffff'" onmouseout="this.style.color='#fff'">
        &copy; {{ .Site.Title }} {{ now.Format "2006" }}
      </a>
    </div>
  </footer>
{{ end }}
