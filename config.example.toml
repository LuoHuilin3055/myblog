baseURL = "https://yourname.github.io/your-blog/"
languageCode = "zh-cn"
title = "Your Blog"
theme = "theme2"

[params]
  site_title = "Your Name"
  description = "欢迎来到我的博客"
  author = "Your Name"
  featured_image = "images/background.jpg"
  page_header_image = "images/background.jpg"
  home_text = "写下你想展示在首页的话"
  custom_404 = true

  avatar = "images/avatar.jpg"
  bio = "Hi, there ~"
  github = "https://github.com/yourname"
  about_subtitle = "欢迎来到我的个人博客"
  random_button_text = "🎲 随机一篇"
  about_button_text = "👤 关于我"
  latest_posts_title = "📝 最新文章"

  enable_busuanzi = true
  enable_click_fireworks = true
  enable_image_lightbox = true
  enable_image_slider = true
  site_since = "2026-03-21"

  [params.comments]
    enable = false
    provider = "waline"
    server_url = ""
    placeholder = "欢迎留言，一起交流~"
    login = "enable"

  [params.schedule]
    enable = true
    title = "日程"
    subtitle = "记录每个时间段在做什么"
    start_hour = 8
    end_hour = 24

  [[params.social_links]]
    name = "GitHub"
    url = "https://github.com/yourname"

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    name = "Articles"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    name = "Notes"
    url = "/murmur/"
    weight = 30
  [[menu.main]]
    name = "Schedule"
    url = "/schedule/"
    weight = 35

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
      xHTML = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "none"
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
