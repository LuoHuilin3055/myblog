baseURL = "https://LuoHuilin3055.github.io/myblog/"
languageCode = "zh-cn"
title = "NGC 2237's Blog"
theme = "theme2"

[params]
  site_title = "NGC 2237"
  description = "欢迎来到NGC_2237的博客"
  author = "NGC 2237"
  featured_image = "images/background.jpg"
  page_header_image = ""
  home_text = "欢迎来到NGC 2237的博客"
  custom_404 = true
  
  # 个人资料卡片配置
  avatar = "images/ChenJM.jpg"  # 头像图片路径（去掉开头的/）
  bio = "Hi, there ~ 👋"  # 个性签名
  github = "https://github.com/LuoHuilin3055"  # GitHub 链接
  about_subtitle = "欢迎来到我的个人博客"
  random_button_text = "🎲 随机一篇"
  about_button_text = "👤 关于我"
  latest_posts_title = "📝 最新文章"
  enable_search = true
  enable_busuanzi = true
  enable_click_fireworks = true
  enable_image_lightbox = true
  enable_image_slider = true
  site_since = "2026-03-21"

  [params.comments]
    enable = false
    provider = "waline"
    server_url = ""
    placeholder = "欢迎留言，一起交流~"
    login = "enable"

  [params.schedule]
    enable = false
    title = "日程"
    subtitle = "记录每个时间段在做什么"
    start_hour = 8
    end_hour = 24

  [[params.social_links]]
    name = "GitHub"
    url = "https://github.com/LuoHuilin3055"

  [[params.social_links]]
    name = "NSSCTF"
    url = "https://www.nssctf.cn/user/47738"
  
  # 公告内容（支持 Markdown）
  announcement = """
虽然不知道你是怎么找到我的，但希望我能给你带来收获
"""
  
  # 网站统计（可选）
  visitor_count = 115  # 访客数
  page_views = 328     # 总浏览量

[menu]
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 10
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    name = "碎碎念"
    url = "/murmur/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
 
[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
      xHTML = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "none"
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
